# Render Blueprint — Fourtime
#
# Dois sites estáticos, de propósito:
#   fourtime-sistema     → frontend/  = o app v5, EM PRODUÇÃO. Não mexer.
#   fourtime-sistema-v6  → app/       = o V6 em construção, para acompanhar.
#
# Enquanto o V6 não alcança paridade, o v5 continua servindo a equipe.
# A troca acontece um dia, num commit só: apontar o serviço de produção
# para app/ e aposentar o frontend/.
services:
  # ---------- PRODUÇÃO (v5) ----------
  - type: web
    name: fourtime-sistema
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Sem rewrite: a navegação do v5 é por estado, não por URL.

  # ---------- PRÉVIA (V6) ----------
  - type: web
    name: fourtime-sistema-v6
    runtime: static
    rootDir: app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # ESTE precisa de rewrite: o V6 usa react-router com rotas reais
    # (/clientes, /kit). Sem isso, dar F5 em /clientes devolve 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
