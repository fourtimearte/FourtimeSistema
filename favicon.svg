/* ============================================================
   FOURTIME V6 — extensões do preset b7AJGDOVg8
   O preset gerado pelo shadcn fica em index.css e é a base.
   Aqui entra só o que ele não traz e o sistema precisa.
   Nenhum valor de aparência nasce fora destes dois arquivos.
   ============================================================ */
:root {
  /* -- paleta CATEGÓRICA -------------------------------------------------
     A rampa --chart-1..5 do preset é toda vermelha: varia luminosidade,
     não matiz. Serve para uma grandeza que cresce (faturamento por mês).
     Não serve para categorias — cinco setores em cinco vermelhos só se
     distinguem por claridade, o que some em P&B e falha em baixa visão.
     Estas oito variam MATIZ com L e C quase constantes.               */
  --cat-1: oklch(0.58 0.19 25);    /* vermelho */
  --cat-2: oklch(0.62 0.15 55);    /* laranja  */
  --cat-3: oklch(0.64 0.13 95);    /* ocre     */
  --cat-4: oklch(0.58 0.14 150);   /* verde    */
  --cat-5: oklch(0.60 0.11 195);   /* teal     */
  --cat-6: oklch(0.55 0.15 250);   /* azul     */
  --cat-7: oklch(0.55 0.17 300);   /* roxo     */
  --cat-8: oklch(0.58 0.16 350);   /* magenta  */
  --cat-foreground: oklch(0.985 0 0);

  /* -- estado: o tema neutro só traz destructive ------------------------ */
  --success: oklch(0.55 0.14 150);
  --success-foreground: oklch(0.985 0 0);
  --warning: oklch(0.68 0.15 75);
  --warning-foreground: oklch(0.205 0 0);
  --info: oklch(0.56 0.13 250);
  --info-foreground: oklch(0.985 0 0);

  /* -- marca externa: cor que não é decisão nossa ----------------------- */
  --whatsapp: oklch(0.68 0.16 152);
  --whatsapp-foreground: oklch(0.145 0 0);

  /* -- movimento -------------------------------------------------------- */
  --ft-dur-fast: 120ms;
  --ft-dur: 200ms;
  --ft-dur-slow: 300ms;
  --ft-ease: cubic-bezier(0.16, 1, 0.3, 1);
}

.dark {
  /* contra fundo preto, L 0.58 desaparece */
  --cat-1: oklch(0.70 0.17 25);
  --cat-2: oklch(0.74 0.14 55);
  --cat-3: oklch(0.78 0.12 95);
  --cat-4: oklch(0.72 0.13 150);
  --cat-5: oklch(0.74 0.10 195);
  --cat-6: oklch(0.68 0.14 250);
  --cat-7: oklch(0.68 0.15 300);
  --cat-8: oklch(0.71 0.15 350);
  --cat-foreground: oklch(0.145 0 0);

  --success: oklch(0.70 0.13 150);
  --success-foreground: oklch(0.145 0 0);
  --warning: oklch(0.78 0.14 75);
  --warning-foreground: oklch(0.145 0 0);
  --info: oklch(0.68 0.12 250);
  --info-foreground: oklch(0.145 0 0);

  --whatsapp: oklch(0.75 0.15 152);
  --whatsapp-foreground: oklch(0.145 0 0);
}

/* ============================================================
   DENSIDADE
   Luma respira; grade de pedidos não pode. Esta camada mexe SÓ
   em espaçamento e altura de controle. Raio, cor, sombra e escala
   tipográfica ficam intactos — é isso que faz a tabela apertada
   continuar parecendo o mesmo sistema do cadastro.

   Uso: <div data-density="compacta"> …tabela… </div>
   ============================================================ */
:root,
[data-density='confortavel'] {
  --ft-control-h: 2.25rem;
  --ft-control-h-sm: 2rem;
  --ft-row-h: 3rem;
  --ft-pad-x: 1rem;
  --ft-pad-y: 0.75rem;
  --ft-gap: 1rem;
  --ft-card-pad: 1.5rem;
}

[data-density='compacta'] {
  --ft-control-h: 1.875rem;
  --ft-control-h-sm: 1.625rem;
  --ft-row-h: 2.25rem;
  --ft-pad-x: 0.625rem;
  --ft-pad-y: 0.375rem;
  --ft-gap: 0.5rem;
  --ft-card-pad: 0.875rem;
}

/* Ponteiro grosso volta para confortável, sempre.
   30px de altura é ótimo com mouse e impossível com o dedo — o alvo
   mínimo de toque é 44×44px, e o sistema é usado no celular dentro do
   galpão. Não remova para "ficar igual ao desktop". */
@media (pointer: coarse) {
  [data-density='compacta'] {
    --ft-control-h: 2.75rem;
    --ft-control-h-sm: 2.5rem;
    --ft-row-h: 3.25rem;
    --ft-pad-x: 1rem;
    --ft-pad-y: 0.75rem;
    --ft-gap: 0.75rem;
    --ft-card-pad: 1.25rem;
  }
}

@theme inline {
  --color-cat-1: var(--cat-1);
  --color-cat-2: var(--cat-2);
  --color-cat-3: var(--cat-3);
  --color-cat-4: var(--cat-4);
  --color-cat-5: var(--cat-5);
  --color-cat-6: var(--cat-6);
  --color-cat-7: var(--cat-7);
  --color-cat-8: var(--cat-8);
  --color-cat-foreground: var(--cat-foreground);
  --color-success: var(--success);
  --color-success-foreground: var(--success-foreground);
  --color-warning: var(--warning);
  --color-warning-foreground: var(--warning-foreground);
  --color-info: var(--info);
  --color-info-foreground: var(--info-foreground);
  --color-whatsapp: var(--whatsapp);
  --color-whatsapp-foreground: var(--whatsapp-foreground);

  --spacing-control: var(--ft-control-h);
  --spacing-control-sm: var(--ft-control-h-sm);
  --spacing-row: var(--ft-row-h);
  --spacing-pad-x: var(--ft-pad-x);
  --spacing-pad-y: var(--ft-pad-y);
  --spacing-gap: var(--ft-gap);
  --spacing-card: var(--ft-card-pad);
}

@layer base {
  /* Números de tabela alinham na coluna. Sem isto, uma coluna de valores
     em Montserrat fica com as casas decimais dançando linha a linha. */
  .num {
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  /* O bug de mobile do V5: item de grid não encolhe abaixo do conteúdo
     (min-width:auto é o padrão), então a tabela larga esticava a coluna
     inteira em vez de rolar dentro do próprio contêiner. */
  .layout-grid > * {
    min-width: 0;
  }
  @media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
}
